name: Actualizar URLs IPTV

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de actualización
        run: python scripts/actualizar_canales.py
        working-directory: iptv_channels

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "Auto-actualización de URLs IPTV" || echo "No hay cambios"
          git push
