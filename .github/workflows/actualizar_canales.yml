name: Actualizar URLs IPTV

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"   # Cada 20 minutos
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Instalar Playwright
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium

      # 4. Instalar dependencias adicionales
      - name: Instalar dependencias adicionales
        run: |
          pip install requests

      # 5. Instalar Xvfb
      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 6. Ejecutar script usando pantalla virtual
      - name: Ejecutar script con Xvfb
        run: xvfb-run -a python3 scripts/actualizar_canales.py

      # 7. Commit & push si hubo cambios
      - name: Commit y push si hubo cambios
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "Auto-actualización de URLs IPTV" || echo "No hay cambios"
          git push
