name: Actualizar URLs IPTV

permissions:
  contents: write

on:
  schedule:
    - cron: "*/20 * * * *"   # Cada 20 minutos
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Instalar Playwright correctamente (sin descargas extras)
      - name: Instalar Playwright
        uses: microsoft/playwright-github-action@v1

      # 4. Instalar tus dependencias Python
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt || pip install requests playwright

      # 5. Ejecutar el script
      - name: Ejecutar script de actualización
        run: python scripts/actualizar_canales.py

      # 6. Commit & push
      - name: Commit y push si hubo cambios
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "Auto-actualización de URLs IPTV" || echo "No hay cambios"
          git push
